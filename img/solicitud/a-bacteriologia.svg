<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" font-family="Montserrat,Segoe UI,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="640" height="360" fill="#f8fafc"/><rect x="14" y="10" width="612" height="330" rx="10" fill="#fff" stroke="#94a3b8" /><text x="32" y="40" font-size="15" fill="#0f172a" font-weight="700" text-anchor="start">Solicitud de bacteriología: además de todo lo anterior</text><g><circle cx="46" cy="84" r="13" fill="#047857"/><text x="46" y="89" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">✓</text></g><text x="70" y="82" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="start">Sitio anatómico</text><text x="70" y="100" font-size="11.5" fill="#64748b" font-weight="500" text-anchor="start">donde se toma la muestra</text><g><circle cx="46" cy="142" r="13" fill="#047857"/><text x="46" y="147" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">✓</text></g><text x="70" y="140" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="start">Terapia de antibióticos</text><text x="70" y="158" font-size="11.5" fill="#64748b" font-weight="500" text-anchor="start">la que tenga el paciente</text><g><circle cx="46" cy="200" r="13" fill="#047857"/><text x="46" y="205" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">✓</text></g><text x="70" y="198" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="start">Nombre de quien toma la muestra</text><text x="70" y="216" font-size="11.5" fill="#64748b" font-weight="500" text-anchor="start">persona responsable de la toma</text><g><circle cx="46" cy="258" r="13" fill="#047857"/><text x="46" y="263" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">✓</text></g><text x="70" y="256" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="start">Hora de toma de la muestra</text><text x="70" y="274" font-size="11.5" fill="#64748b" font-weight="500" text-anchor="start">hora exacta</text><text x="632" y="350" font-size="9.5" fill="#64748b" font-weight="500" text-anchor="end">Ilustración esquemática con datos ficticios</text></svg>