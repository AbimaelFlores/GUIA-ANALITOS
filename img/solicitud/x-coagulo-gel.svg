<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" font-family="Montserrat,Segoe UI,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="640" height="360" fill="#f8fafc"/><text x="320" y="34" font-size="15" fill="#0f172a" font-weight="700" text-anchor="middle">Tubo seco o con gel con mala conservación (&gt; 1 hora de la toma)</text><clipPath id="c8"><path d="M90 78 h60 v202.0 a30.0 30.0 0 0 1 -60 0 z"/></clipPath><path d="M90 78 h60 v202.0 a30.0 30.0 0 0 1 -60 0 z" fill="#fff" stroke="#94a3b8" stroke-width="2.2"/><g clip-path="url(#c8)"><rect x="90" y="240" width="60" height="70" fill="#7f1d1d"/><rect x="90" y="224" width="60" height="16" fill="#9ca3af"/><rect x="90" y="128" width="60" height="96" fill="#fde68a"/></g><path d="M90 78 h60 v202.0 a30.0 30.0 0 0 1 -60 0 z" fill="none" stroke="#64748b" stroke-width="2.2"/><rect x="87" y="60" width="66" height="18" rx="4" fill="#eab308" stroke="rgba(0,0,0,.25)"/><text x="170" y="120" font-size="12" fill="#0f172a" font-weight="600" text-anchor="start">Suero</text><text x="170" y="175" font-size="12" fill="#0f172a" font-weight="600" text-anchor="start">Gel separador</text><text x="170" y="255" font-size="12" fill="#0f172a" font-weight="600" text-anchor="start">Coágulo</text><rect x="300" y="80" width="310" height="200" rx="8" fill="#fff" stroke="#cbd5e1" /><text x="316" y="112" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="start">Se evalúa la retracción del coágulo</text><text x="316" y="140" font-size="12" fill="#64748b" font-weight="500" text-anchor="start">• Coágulo bien retraído y suero</text><text x="316" y="158" font-size="12" fill="#64748b" font-weight="500" text-anchor="start">   separado: valorar con el personal</text><text x="316" y="176" font-size="12" fill="#64748b" font-weight="500" text-anchor="start">   profesional del laboratorio.</text><text x="316" y="206" font-size="12" fill="#b91c1c" font-weight="600" text-anchor="start">• Sin retracción visible o mala</text><text x="316" y="224" font-size="12" fill="#b91c1c" font-weight="600" text-anchor="start">   conservación (&gt; 1 h): rechazo.</text><text x="632" y="350" font-size="9.5" fill="#64748b" font-weight="500" text-anchor="end">Ilustración esquemática con datos ficticios</text></svg>